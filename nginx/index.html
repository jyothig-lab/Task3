<!DOCTYPE html>
<html>

<head>

<title>School Bus Address Change</title>

<style>

body{

font-family:Arial;
background:#f2f2f2;

}

.container{

width:500px;

margin:auto;

margin-top:40px;

background:white;

padding:25px;

border-radius:10px;

box-shadow:0px 0px 10px gray;

}

input,textarea{

width:100%;

padding:10px;

margin:10px 0;

}

button{

background:green;

color:white;

padding:10px;

border:none;

width:100%;

font-size:18px;

}

</style>

</head>

<body>

<div class="container">

<h2 align="center">
School Bus Address Change Request
</h2>

<form action="http://localhost:5000/submit" method="POST">

<label>Student Name</label>

<input type="text" name="student" required>

<label>Roll Number</label>

<input type="text" name="roll" required>

<label>Current Address</label>

<textarea name="old" required></textarea>

<label>New Address</label>

<textarea name="new" required></textarea>

<button type="submit">
Submit Request
</button>

</form>

</div>

</body>

</html>
